<!-- The menu decides which links fit before the web fonts arrive; measure it again once they have loaded -->
<script>
  window.addEventListener('load', function () {
    if (document.fonts) {
      document.fonts.ready.then(function () { window.dispatchEvent(new Event('resize')); });
    }
  });
</script>
